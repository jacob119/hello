<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('로그인 · Hello')}"></head>
<body>
<main class="split">
	<section class="split__hero" aria-labelledby="hero-heading">
		<p class="eyebrow">hello service</p>
		<h1 id="hero-heading" class="wordmark">Hello<span class="wordmark__dot">.</span></h1>
		<p class="hero__lede">짧은 인사로 시작하는 하루.<br>계정으로 로그인해 주세요.</p>
	</section>

	<section class="split__panel" aria-labelledby="login-heading">
		<form class="card" th:action="@{/login}" method="post" novalidate>
			<h2 id="login-heading" class="card__title">로그인</h2>

			<p class="notice notice--error" role="alert" th:if="${param.error}">
				아이디 또는 비밀번호가 올바르지 않습니다.
			</p>
			<p class="notice notice--info" role="status" th:if="${param.logout}">
				로그아웃되었습니다.
			</p>

			<div class="field">
				<label class="field__label" for="username">아이디</label>
				<input class="field__input" id="username" name="username" type="text"
					autocomplete="username" autocapitalize="none" spellcheck="false"
					required autofocus>
			</div>

			<div class="field">
				<label class="field__label" for="password">비밀번호</label>
				<input class="field__input" id="password" name="password" type="password"
					autocomplete="current-password" required>
			</div>

			<button class="button" type="submit">
				<span>로그인</span>
				<span class="button__arrow" aria-hidden="true">→</span>
			</button>
		</form>
	</section>
</main>
</body>
</html>
