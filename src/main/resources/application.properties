spring.application.name=hello

# Return RFC 9457 problem details for errors (e.g. validation failures)
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info

# Login account. Defaults are for local development only; override via environment in any shared deployment.
# APP_PASSWORD may be plain text or a pre-hashed value such as {bcrypt}$2a$10$...
spring.security.user.name=${APP_USERNAME:jacob}
spring.security.user.password=${APP_PASSWORD:demo1234}
